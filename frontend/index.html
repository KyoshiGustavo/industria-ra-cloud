<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR - Monitoramento Robô Industrial</title>
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="js/app.js"></script>

    <style>
        /* Estilos do painel de botões overlay */
        #ar-overlay-ui {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.65);
            padding: 10px 15px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
        }

        .ar-btn {
            border: none;
            color: white;
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn-base { background-color: #FF5722; }
        .btn-braco { background-color: #2196F3; }
        .btn-punho { background-color: #4CAF50; }
        .btn-garra { background-color: #E91E63; }
    </style>
</head>
<body>

    <!-- Painel de Informações Pop-up -->
    <div id="info-panel">
        <div id="panel-content"></div>
        <button onclick="fecharPainel()">Fechar</button>
    </div>

    <!-- Botões Flutuantes (2D Overlay) para Garantia de Acessibilidade no Telemóvel -->
    <div id="ar-overlay-ui">
        <button class="ar-btn btn-base" onclick="exibirInfoEstatica('Base do Robô', 'Estrutura de fixação e rotação do Eixo 1. Suporta toda a carga dinâmica do manipulador.')">Base</button>
        <button class="ar-btn btn-braco" onclick="exibirInfoEstatica('Braço Principal', 'Segmento articulado responsável pela elevação e alcance (Eixos 2 e 3).')">Braço</button>
        <button class="ar-btn btn-punho" onclick="exibirInfoEstatica('Punho Articulado', 'Mecanismo de orientação final (Eixos 4, 5 e 6) de alta precisão.')">Punho</button>
        <button class="ar-btn btn-garra" onclick="carregarTelemetria()">Garra (Telemetria)</button>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: assets/target-robo.mind;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false"
        raycaster="objects: .clickable"
        cursor="rayOrigin: mouse; fuse: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-sphere hotspot-action="tipo: base" class="clickable" position="-0.2 -0.4 0" radius="0.1" color="#FF5722"></a-sphere>
            <a-sphere hotspot-action="tipo: braco" class="clickable" position="-0.2 0.0 0" radius="0.1" color="#2196F3"></a-sphere>
            <a-sphere hotspot-action="tipo: punho" class="clickable" position="0.2 0.3 0" radius="0.1" color="#4CAF50"></a-sphere>
            <a-sphere hotspot-action="tipo: garra" class="clickable" position="0.4 0.1 0" radius="0.12" color="#E91E63"></a-sphere>
        </a-entity>
    </a-scene>

</body>
</html>
