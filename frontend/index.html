<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR - Monitoramento Robô Industrial</title>
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="js/app.js"></script>
</head>
<body>

    <!-- Painel Pop-up -->
    <div id="info-panel">
        <div id="panel-content"></div>
        <button onclick="fecharPainel()">Fechar</button>
    </div>

    <!-- Interface Overlay de Acesso Rápido -->
    <div id="ar-overlay-ui" style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; gap: 10px; background: rgba(0,0,0,0.65); padding: 10px 15px; border-radius: 30px;">
        <button style="border:none; color:white; background:#FF5722; padding:10px 14px; border-radius:20px; font-weight:bold;" onclick="exibirInfoEstatica('Base do Robô', 'Estrutura de fixação e rotação do Eixo 1. Suporta toda a carga dinâmica do manipulador.')">Base</button>
        <button style="border:none; color:white; background:#2196F3; padding:10px 14px; border-radius:20px; font-weight:bold;" onclick="exibirInfoEstatica('Braço Principal', 'Segmento articulado responsável pela elevação e alcance (Eixos 2 e 3).')">Braço</button>
        <button style="border:none; color:white; background:#4CAF50; padding:10px 14px; border-radius:20px; font-weight:bold;" onclick="exibirInfoEstatica('Punho Articulado', 'Mecanismo de orientação final (Eixos 4, 5 e 6) de alta precisão.')">Punho</button>
        <button style="border:none; color:white; background:#E91E63; padding:10px 14px; border-radius:20px; font-weight:bold;" onclick="carregarTelemetria()">Garra (Telemetria)</button>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: ./assets/target-robo.mind;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false">
            <a-cursor id="cursor" raycaster="objects: .clickable" cursor="fuse: false; rayOrigin: mouse"></a-cursor>
        </a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-sphere hotspot-listener="base" class="clickable" position="-0.2 -0.4 0" radius="0.15" color="#FF5722"></a-sphere>
            <a-sphere hotspot-listener="braco" class="clickable" position="-0.2 0.0 0" radius="0.15" color="#2196F3"></a-sphere>
            <a-sphere hotspot-listener="punho" class="clickable" position="0.2 0.3 0" radius="0.15" color="#4CAF50"></a-sphere>
            <a-sphere hotspot-listener="garra" class="clickable" position="0.4 0.1 0" radius="0.18" color="#E91E63"></a-sphere>
        </a-entity>
    </a-scene>

</body>
</html>
